services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familybot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familybot}
      POSTGRES_DB: ${POSTGRES_DB:-familybot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familybot} -d ${POSTGRES_DB:-familybot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-familybot}:${POSTGRES_PASSWORD:-familybot}@postgres:5432/${POSTGRES_DB:-familybot}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-placeholder}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-familybot}:${POSTGRES_PASSWORD:-familybot}@postgres:5432/${POSTGRES_DB:-familybot}
      ENV: ${ENV:-prod}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
