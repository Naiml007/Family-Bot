[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thesnow"
version = "0.1.0"
description = "TheSnow Discord bot"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "discord.py>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
thesnow = "thesnow.main:run"

[tool.setuptools.packages.find]
include = ["thesnow*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning:discord\\.player",
]
