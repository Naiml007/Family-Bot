[project]
name = "familybot"
version = "0.1.0"
description = "Modular Discord bot for managing a Grand RP family"
readme = "PLAN.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "discord.py>=2.4.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "jishaku>=2.5.2",
    "pyright>=1.1.390",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
familybot = "familybot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familybot"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "S",
    "RUF",
]
ignore = [
    "S101",  # assert allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["migrations"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests requiring a PostgreSQL database",
]
